[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reaction-reference"
version = "0.1.0"
description = "Evidence-aware Markush reaction precedent retrieval"
requires-python = ">=3.12,<3.13"
dependencies = ["rdkit==2026.3.2", "pydantic>=2.13.2,<3", "pydantic-settings>=2,<3", "fastapi>=0.128,<1", "uvicorn>=0.40,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4"]

[project.scripts]
reaction-reference = "reaction_reference.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<2", "hypothesis>=6,<7", "build>=1,<2", "hatchling>=1.27,<2", "editables>=0.5,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/reaction_reference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/interfaces/api.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["reaction_reference"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
