services:
  reference:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RR_SOURCE_KIND: ${RR_SOURCE_KIND:-jsonl}
      RR_POSTGRES_DSN: ${RR_POSTGRES_DSN:-}
      RR_POSTGRES_TABLE: ${RR_POSTGRES_TABLE:-reaction_v3}
      RR_API_TOKEN: ${RR_API_TOKEN:-}
      RR_MAX_CONCURRENT_RUNS: ${RR_MAX_CONCURRENT_RUNS:-2}
      RR_STORE_PATH: /app/var/runs
    volumes:
      - runs:/app/var/runs
    tmpfs:
      - /tmp
    read_only: true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  runs:
