# 合成参考价值评分配置
# 目的：让“解决目标母核及其连接问题”的方法，整体上高于仅处理普通支链尾部的方法。
# 总分 = 各基础维度的【0～1原值 × 权重】之和 + 可选奖励/偏好分。
# 基础权重必须合计100；这里的分数是排序启发式，不是合成成功概率。
# 注意：配方尚未经独立化学专家集校准；调分后须同时比较多个目标，不能只看一个例子。
# 同一条反应不因被多个查询命中而重复加分；使用同一个具体匹配见证计算母核与整体覆盖。
# 修改后重启服务再检索或重新排序，避免同一任务中途更换规则。
version: target-method-score-1
status: heuristic_not_expert_calibrated

weights:
  # 母核覆盖：覆盖目标环系/无环功能锚点骨架的程度；桥环/稠环原子会得到拓扑加权。
  # 原因：普通乙酯、甲基等小片段容易大量命中，不能因此压过母核构建线索。
  # 提高本项会更偏好包含母核的先例，但可能降低纯支链方法的展示机会。
  core_coverage: 30

  # 整体覆盖：当前同一见证覆盖的目标重原子数 / 目标总重原子数。
  # 目的：在母核条件相近时，提高较完整结构先例的价值；不能把多个先例的覆盖拼成一个。
  target_coverage: 18

  # 中心位置：按下方center_values，把母核内部、支链头部与远端尾部分开计分。
  # 原因：反应中心“落在目标上”还不够，母核构建与母核—支链连接更值得参考。
  center_position: 20

  # 双侧覆盖：2 × 同一见证共享重原子数 / (目标重原子数 + 来源材料重原子数)。
  # 目的：降低巨大来源分子仅包含目标一小段时的优势；不能等同于分子量差越小越容易合成。
  balanced_coverage: 10

  # 连接环境：1 / (1 + 氢数与总连接数差异 / environment_distance_scale)。
  # 仅比较该见证内非芳香原子；用于区分甲基/苄基、一级/三级中心等结构迁移差异。
  # 保持较低权重，避免“普通支链尾部恰好一致”压过有差异的关键母核方法。
  # 局限：没有预测取代基电子效应、位阻、配位、竞争反应或催化剂适用范围。
  environment_match: 8

  # 方法贡献：实际目标成键、目标原子修饰及未确定方法分别按method_values计分。
  # 来源额外标注缺失不能抹去图上的目标方法贡献，也不能把图推定写成实验成功。
  method_contribution: 7

  # 来源证据：仅按已有产物观察/来源主张计分；没有标注就是未知，不自动推断失败。
  # 本项小于结构贡献；防止全库缺少额外审核字段时，所有方法被压成同一优先级。
  source_evidence: 5

  # 指纹相似度只作弱信号；化学方法价值不能由全分子相似度替代。
  similarity: 2

core_definition:
  # 环原子权重 = ring_base_weight + ring_cycle_weight × 所属完整环系独立环数。
  # 共享原子的环合并；独立环数 = 环系内部键数 - 环系原子数 + 1。
  # 这是突出桥环/稠环的拓扑启发式，不是“环数越多就越难”的实验结论。
  ring_base_weight: 1
  ring_cycle_weight: 1
  # 无环目标：官能团锚点之间的连接路径作为骨架；没有锚点时使用完整重原子框架。
  acyclic_atom_weight: 1

center_values:
  # 原始位置值均为0～1，乘以center_position权重。
  core_internal: 1.0
  # 直接母核—支链边界及其相连功能单元；例如苯甲酰胺的酰基C—N键。
  # 酯的O—乙基、醚的远端烷基不纳入连接头部，避免“尾部成键”冒充核心连接。
  core_branch_head: 0.8
  # 远端尾部只从其他维度取得分数；位置未知也不获得正向中心奖励。
  branch_remote_or_unresolved: 0.0

method_values:
  formed_target_bond: 1.0
  changed_target_atom: 0.6
  unresolved: 0.0

evidence_values:
  reported_obtained: 1.0
  source_reported_claim: 0.5
  unknown: 0.0

# 尺度越大，环境差异的惩罚越弱；必须大于0。
environment_distance_scale: 1
# 没有具体匹配见证时不能把“差异未知”奖励成“完全相同”。
environment_unknown_value: 0

# 完整目标且已有来源获得证据的附加奖励；仅产品字段相同不能触发。
# 目的：保留已有目标取得方法，包括脱保护；不会声称本步构建了所有目标键。
reported_target_bonus: 100

# 以下仅在用户明确选择相应排序偏好时启用；默认reference_first不读取条件来加分。
process_preference_weight: 10
process_values:
  # 操作分 = 温度占比/(1+相对参照温度的最大偏离/温度尺度)
  #        + 时长占比/(1+持续秒数/时长尺度)。未知或异常项贡献0，不当成室温或零时长。
  # 这是操作偏好，不能解释为安全性判断；低温和高温都可能需要额外设备。
  reference_temperature_c: 25
  temperature_scale_c: 25
  duration_scale_seconds: 3600
  temperature_share: 0.5
  duration_share: 0.5

lab_fit_weight: 10
lab_values:
  # 仅比较已明确提供的实验室能力。unknown不意味着设备满足要求。
  pass: 1.0
  unknown: 0.25
  not_applicable: 0.25
  fail: 0.0

# 不由本文件控制的资格门槛：目标外反应、输入使用线索与中心未解决候选保留在完整资料包，
# 不占当前方法主推荐位；完整目标产物可保留，但未确认来源获得时不触发上面的100分奖励。
# 调大某项权重不能绕过匹配核验、来源质量门槛或把未验证方法变成已验证方法。
