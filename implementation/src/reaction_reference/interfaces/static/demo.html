<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>合成参考检索 · 验证 Demo</title>
<style>body{font:16px/1.6 system-ui;background:#f4f7f6;color:#20362f;max-width:1300px;margin:28px auto;padding:0 20px}h1{margin-bottom:0}section,article{background:white;border:1px solid #d6e2dc;border-radius:12px;padding:18px;margin:16px 0}textarea{width:98%;height:85px;font:15px monospace}input,button,select{font:inherit;padding:8px;margin:5px}button{background:#176b50;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.grid article{margin:0}.molecule{width:100%;height:280px;object-fit:contain}.reaction{display:block;width:auto;max-width:none;height:auto;object-fit:contain}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}small,.muted{color:#65756d}.badge{background:#e7f2ec;padding:3px 9px;border-radius:5px}#message{white-space:pre-wrap}summary{cursor:pointer}a{color:#176b50}</style>
<h1>合成参考检索 · 验证 Demo</h1><p class="muted">输入目标 → 看查询结构 → 查参考反应。所有结构图由 RDKit 绘制，实际检索使用正式流程。</p>
<section><label>目标分子 SMILES<textarea id="smiles">CCN(C)C(=O)c1ccccc1</textarea></label>
<label>内部令牌（未配置可留空）<input id="token" type="password" autocomplete="off"></label>
<label>任务预算<select id="tasks"><option value="40">40（默认）</option><option value="100">100</option><option value="160">160</option></select></label>
<label>时间预算<select id="time"><option value="10000">10秒</option><option value="30000">30秒</option></select></label>
<button id="preview">预览查询</button><button id="search">开始检索</button><button id="cancel" disabled>取消</button><a href="/">原查看页面</a>
<p id="message" role="status">先预览会生成哪些查询；执行后可查看额外补查、放宽查询及实际执行状态。</p></section>
<section id="targetBox" hidden><h2>目标结构</h2><img id="target" class="molecule" alt="目标分子"></section>
<section><h2>查询结构 <span id="queryCount"></span></h2><p>目标图高亮固定原子；查询图展示 SMARTS。精确支链可能额外用于数据库预筛。未执行、初选结束与独立补查结束不是同一范围。</p><div id="queries" class="grid"></div></section>
<section><h2>推荐参考反应 <span id="resultCount"></span></h2><p>按系统实际推荐顺序展示来源反应物 → 产物。图中事实来自抽取记录，可能有错误；结构命中不等于已验证能合成目标。</p><div id="results"></div></section>
<script>
let run=null, generation=0, busy=false;
const $=id=>document.getElementById(id);
const names={queued:'排队中',running:'检索中',succeeded:'已完成',cancelled:'已取消',timed_out:'已超时',failed:'失败',task_budget:'任务预算用尽',global_deadline:'时间预算用尽',source_query_failed_or_timed_out:'部分查询失败或超时',usage_task_budget:'使用先例查询预算用尽',connection_method:'连接方法线索',local_method:'局部方法线索',modification:'修饰反应',usage:'结构使用参考',structure_clue:'结构线索',unknown:'尚未明确',target_outcome:'目标产物参考'};
// 将常见状态翻译为中文，未知代码保留原值供核查。
function label(value){return names[value]||value;}
// 使用文本节点展示来源内容，SVG仅作为独立图片加载。
function node(tag,text,parent){const n=document.createElement(tag);if(text!==null)n.textContent=text;if(parent)parent.append(n);return n;}
function picture(svg,parent,kind='molecule'){const img=node('img',null,parent);img.className=kind;img.alt=kind==='reaction'?'来源反应结构':'RDKit查询结构';img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);return img;}
function detail(title,value,parent){const d=node('details',null,parent);node('summary',title,d);node('pre',typeof value==='string'?value:JSON.stringify(value,null,2),d);}
// 令牌只用于当前页面请求，不写入浏览器存储。
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json',...($('token').value?{Authorization:'Bearer '+$('token').value}:{}),...(options.headers||{})}});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data));return data;}
function request(){return {target:{value:$('smiles').value.trim()},budget:{max_tasks:Number($('tasks').value),time_ms:Number($('time').value)}};}
function controls(value){busy=value;$('preview').disabled=value;$('search').disabled=value;$('smiles').disabled=value;$('cancel').disabled=!value||!run;}
// 实际状态逐阶段列出，不把近邻池结束解释为全库搜索完毕。
function renderQueries(data){$('targetBox').hidden=false;$('target').src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(data.target_svg);$('queries').replaceChildren();$('queryCount').textContent=`（${data.queries.length}）`;for(const item of data.queries){const f=item.family;const card=node('article',null,$('queries'));const layer={whole:'整体',core:'核心',fragment:'分片'}[f.layer]||f.layer;node('b',layer+' · '+(f.parent_id?'动态补查':'初始查询'),card);node('p',f.description,card);picture(item.target_svg,card);node('small','上：目标固定位置；下：实际查询结构',card);picture(item.query_svg,card);const states=Object.values(data.family_states||{}).filter(s=>s.family_id===f.id);node('p',data.family_states?(states.length?'已调度 '+states.length+' 个查询阶段':'未调度 / 预算内未执行'):'预览：尚未执行',card).className='badge';if(states.length)detail('实际阶段与完成范围',states,card);if(f.r_constraints.length){node('p','包含额外支链约束：源端必要条件如下，最终仍完整核验',card);picture(item.prefilter_svg,card);}detail('规则、SMARTS、支链约束、父查询',f,card);}}
function renderResults(data){$('results').replaceChildren();$('resultCount').textContent=`（${data.recommendations.length}）`;for(const [i,item] of data.recommendations.entries()){const r=item.reference;const card=node('article',null,$('results'));node('h3',`${i+1}. ${r.record.source.namespace}:${r.record.source.record_id}`,card);node('p',`来源：${r.record.source.document_id||'未知'} · ${r.record.source.location||'未定位'} · 匹配角色：${r.material.role==='product'?'产物':'反应物使用参考'}`,card);if(item.reaction_svg)picture(item.reaction_svg,node('div',null,card),'reaction').parentElement.className='scroll';else node('p',item.drawing_error,card);const cov=r.coverage.joint_witness;node('p',`目标原子连接覆盖：${cov?Math.round(cov.atom_coverage*100)+'%':'未知'}；贡献：${label(r.contribution)}；目标获得证据：${r.obtainment_hit?'有':'未确认'}`,card);detail('匹配原因与限制',{reasons:r.reasons,unresolved:r.unresolved,projected_changes:r.coverage.projected_changes,families:r.family_ids},card);detail('来源条件、试剂与材料',{conditions:r.record.conditions,materials:r.record.materials,source:r.record.source},card);}detail('统计、截断原因与来源问题',{statistics:data.statistics,stop_reasons:data.stop_reasons,source_issues:data.source_issues},$('results'));}
// 每次操作持有版本号，旧请求不得覆盖新目标；不并发运行多个检索。
async function execute(search){if(busy)return;const ticket=++generation;run=null;controls(true);$('message').textContent='正在生成查询结构…';$('results').replaceChildren();$('resultCount').textContent='';try{const req=request();const preview=await api('/v1/demo/preview',{method:'POST',body:JSON.stringify(req)});if(ticket!==generation)return;renderQueries(preview);if(!search){$('message').textContent='预览完成，尚未访问反应来源。';return;}const started=await api('/v1/search-runs',{method:'POST',body:JSON.stringify(req)});run=started.run_id;$('cancel').disabled=false;while(ticket===generation){const state=await api('/v1/search-runs/'+run);$('message').textContent=`状态：${label(state.lifecycle)} · 已保留材料：${state.statistics?.unique_structures??0}`;if(['succeeded','cancelled','timed_out','failed'].includes(state.lifecycle)){if(state.latest_snapshot_id){const result=await api('/v1/search-runs/'+run+'/demo');if(ticket!==generation)return;renderQueries(result);renderResults(result);$('message').textContent=`检索结束：${label(state.lifecycle)}。${result.stop_reasons.length?'范围受限：'+result.stop_reasons.map(label).join('、'):'请查看各查询范围。'}`;}else $('message').textContent='未生成结果：'+JSON.stringify(state.error||state.lifecycle);break;}await new Promise(resolve=>setTimeout(resolve,800));}}catch(error){$('message').textContent='请求失败：'+error.message;}finally{if(ticket===generation)controls(false);}}
$('preview').onclick=()=>execute(false);
$('search').onclick=()=>execute(true);
// 取消调用服务端真实取消接口，等待轮询返回终态。
$('cancel').onclick=async()=>{if(!run)return;$('cancel').disabled=true;try{await api('/v1/search-runs/'+run+'/cancel',{method:'POST'});$('message').textContent='已请求取消，等待保存已有结果…';}catch(error){$('message').textContent=error.message;$('cancel').disabled=false;}};
</script></html>
